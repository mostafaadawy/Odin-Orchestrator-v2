name: odin_app
description: Odin Orchestrator companion app (Phase 2) — projects, chat, and the Anchor Connect status page. Targets web, Android and iOS from one Dart codebase.
publish_to: "none"
version: 0.1.0+1

environment:
  # Uses Color.withValues / DropdownButtonFormField.initialValue (Flutter 3.27+ / Dart 3.6+).
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  # Mobile-only local notifications. Imported behind a conditional import so web still compiles.
  flutter_local_notifications: ^17.2.2
  # Voice via the device/OS engine (works on web, iOS, Android — no models to ship).
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  # Biometric (Face ID / Touch ID) first-access on mobile. Behind a conditional import for web.
  local_auth: ^2.3.0
  # WhatsApp-style chat mode: pick/capture images, pick files (docx/zip), record voice, play audio.
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  record: ^6.0.0
  audioplayers: ^6.1.0
  cross_file: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates real iOS/Android/web launcher icons from one source PNG (professional app look).
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/odin_icon.png

# Run `dart run flutter_launcher_icons` (the phase shells do this automatically) to stamp the icon
# onto every platform. Source is the Odin Ω mark on the brand gradient.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/odin_icon.png"
  adaptive_icon_background: "#0E1320"
  adaptive_icon_foreground: "assets/icon/odin_icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/odin_icon.png"
