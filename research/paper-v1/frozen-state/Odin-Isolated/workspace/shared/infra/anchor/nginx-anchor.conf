# TLS termination + reverse proxy for the Odin Anchor on the VM, and (optionally) serving the web build.
#   sudo cp infra/anchor/nginx-anchor.conf /etc/nginx/sites-available/odin-anchor
#   sudo ln -s /etc/nginx/sites-available/odin-anchor /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d anchor.YOURDOMAIN   # issues + wires the TLS cert
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name anchor.YOURDOMAIN;          # <-- set your VM domain/hostname
    return 301 https://$host$request_uri;   # force HTTPS
}

server {
    listen 443 ssl;
    server_name anchor.YOURDOMAIN;          # <-- set your VM domain/hostname

    # certbot fills these in:
    ssl_certificate     /etc/letsencrypt/live/anchor.YOURDOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anchor.YOURDOMAIN/privkey.pem;

    # The Anchor HTTP service (queue / auth / webhooks).
    location /anchor/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OPTIONAL: serve the web build (Flutter web `build/web`, or the desktop web build) as the dashboard.
    location / {
        root /var/www/odin-web;             # copy your web build here
        try_files $uri /index.html;
    }
}
