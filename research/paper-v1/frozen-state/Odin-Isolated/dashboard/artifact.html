<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Odin-Orchestrator Dashboard</title>
<style>
  :root{color-scheme:light;--bg:#f6f8fc;--panel:#fff;--line:#e3e9f2;--txt:#10203a;
    --muted:#64748b;--accent:#2563eb;--good:#0ea271;--warn:#d97706;--bad:#dc2626;--chip:#eef3fb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;background:var(--panel)}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#0ea271);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  h1{font-size:16px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:2px}
  main{padding:18px;max-width:1100px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}
  .card h2{font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .big{font-size:28px;font-weight:800}
  .bar{height:9px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:11px}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#0ea271)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .row:last-child{border-bottom:none}
  .chip{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--chip);white-space:nowrap}
  .s-complete{color:var(--good)}.s-progress{color:var(--accent)}.s-wait{color:var(--warn)}.s-block{color:var(--bad)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:7px}
  .d-complete{background:var(--good)}.d-progress{background:var(--accent)}.d-wait{background:var(--warn)}.d-block{background:var(--bad)}
  .muted{color:var(--muted)}.empty{color:var(--muted);font-style:italic;font-size:13px}
  ul.feat{list-style:none;padding:0;margin:0}ul.feat li{padding:5px 0;font-size:13.5px}
  .agents{display:flex;flex-wrap:wrap;gap:7px}.agent{background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px}
  code{color:var(--accent);font-size:12px}
  .span2{grid-column:span 2}@media(max-width:720px){.span2{grid-column:span 1}}
</style>
</head>
<body>
<header>
  <div class="logo">Ω</div>
  <div><h1>Odin-Orchestrator — CTO Brain</h1><div class="sub">Multi-Agent AI Orchestration · Odin AI Systems · <span id="upd"></span></div></div>
</header>
<main>
  <div class="grid">
    <div class="card"><h2>Overall Progress</h2><div class="big"><span id="pct"></span>%</div><div class="muted" id="ph"></div><div class="bar"><span id="bf"></span></div></div>
    <div class="card"><h2>Delivery Status</h2><div id="del" style="font-size:13.5px"></div></div>
    <div class="card"><h2>Pending Approvals</h2><div id="appr"></div></div>
    <div class="card span2"><h2>Phases</h2><div id="phases"></div></div>
    <div class="card"><h2>Features</h2><ul class="feat" id="feat"></ul></div>
    <div class="card span2"><h2>Active Tasks &amp; Owners</h2><div id="tasks"></div></div>
    <div class="card"><h2>Agent Team</h2><div class="agents" id="agents"></div></div>
    <div class="card span2"><h2>Recent History &amp; Decisions</h2><div id="hist"></div></div>
  </div>
</main>
<script>
const DATA={
 updatedUtc:"2026-06-21T14:00:00Z",phase:"Backbone complete: dispatcher + mobile + voice all wired",progressPercent:78,
 deliveryStatus:"Backbone complete: dispatcher routes every channel (chat/voice/mobile) and enforces the approval gate; voice + mobile wired. Run USE_VOICE=1 ./server/run.sh → / (desktop) or /mobile.html (phone).",
 phases:[{id:1,name:"Foundation & folder structure",status:"complete"},{id:2,name:"Specialized agent team",status:"complete"},{id:3,name:"Approval & safety gate",status:"complete"},{id:4,name:"Dashboard (static + live)",status:"complete"},{id:5,name:"Voice + Ruflo review + Azure procedure",status:"complete"},{id:6,name:"Voice wired end-to-end (local server)",status:"complete"},{id:7,name:"Brain↔agent dispatcher",status:"complete"},{id:8,name:"Mobile access (LAN + token; exposure gated)",status:"complete"}],
 features:{planned:["Rules/memory system","History/audit + revert","Agent team","Approval gate","Dashboard","Voice (EN+AR, local)","Azure secure procedure","End-to-end voice wiring","Brain↔agent dispatcher","Mobile access"],completed:["Rules/memory system","History/audit + revert","Agent team","Approval gate","Dashboard","Voice (EN+AR, local)","Azure secure procedure","End-to-end voice wiring","Brain↔agent dispatcher","Mobile access"]},
 tasks:[{id:"T-401",title:"Brain↔agent dispatcher (router+hooks+gate)",agent:"CTO Brain",status:"complete"},{id:"T-402",title:"Wire dispatcher into /chat + voice + /dispatch",agent:"Backend",status:"complete"},{id:"T-403",title:"Mobile UI + token gate + runbook",agent:"Frontend",status:"complete"},{id:"T-501",title:"Swap in real sub-agents (optional)",agent:"CTO Brain",status:"pending"},{id:"T-502",title:"Connect live Azure VM (needs access)",agent:"DevOps & Cloud",status:"blocked-on-owner"}],
 approvals:{pending:[],note:"No approvals requested yet."},
 history:[{type:"SNAPSHOT",ref:"snap-0004",summary:"Restore point after dispatcher + mobile; all backbone items wired.",ts:"2026-06-21 14:00"},{type:"VERIFY",ref:"dispatcher+mobile",summary:"Routing 6/6; /chat 401 no-token/200 token; gated request returns approval msg (not executed); /dispatch JSON; /mobile.html served.",ts:"2026-06-21 14:00"},{type:"BUILD",ref:"mobile",summary:"mobile.html + ODIN_ACCESS_TOKEN gate + mobile-access runbook (LAN now, exposure gated).",ts:"2026-06-21 14:00"},{type:"BUILD",ref:"ADR-008",summary:"Brain↔agent dispatcher: deterministic router, hooks, approval gate on every channel.",ts:"2026-06-21 14:00"},{type:"SNAPSHOT",ref:"snap-0003",summary:"Restore point after wiring voice into the dashboard.",ts:"2026-06-21 12:00"}]
};
const AGENTS=["Frontend","Backend","DevOps & Cloud","Security & Compliance","QA & Testing","Database"];
const sc=s=>/complete/.test(s)?"complete":/progress/.test(s)?"progress":/wait|await/.test(s)?"wait":/block/.test(s)?"block":"progress";
upd.textContent="updated "+DATA.updatedUtc; pct.textContent=DATA.progressPercent; ph.textContent=DATA.phase; bf.style.width=DATA.progressPercent+"%"; del.textContent=DATA.deliveryStatus;
phases.innerHTML=DATA.phases.map(p=>{const c=sc(p.status);return `<div class="row"><span><span class="dot d-${c}"></span>Phase ${p.id} — ${p.name}</span><span class="chip s-${c}">${p.status}</span></div>`}).join("");
const comp=new Set(DATA.features.completed);
feat.innerHTML=DATA.features.planned.map(f=>comp.has(f)?`<li><span style="color:var(--good)">✓</span> ${f}</li>`:`<li><span class="muted">○ ${f}</span></li>`).join("");
tasks.innerHTML=DATA.tasks.map(t=>{const c=sc(t.status);return `<div class="row"><span><span class="dot d-${c}"></span>${t.id} · ${t.title}</span><span class="chip">${t.agent}</span><span class="chip s-${c}">${t.status}</span></div>`}).join("");
appr.innerHTML=DATA.approvals.pending.length?DATA.approvals.pending.map(a=>`<div class="row"><span><span class="dot d-wait"></span>${a.id||a}</span><span class="chip s-wait">awaiting you</span></div>`).join(""):`<div class="empty">${DATA.approvals.note}</div>`;
agents.innerHTML=AGENTS.map(a=>`<div class="agent">${a}</div>`).join("");
hist.innerHTML=DATA.history.map(h=>`<div class="row"><span><code>${h.type}</code> ${h.summary}</span><span class="chip">${h.ts}</span></div>`).join("");
</script>
</body>
</html>
