<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Odin — Mobile</title>
<style>
  :root{--bg:#0b1220;--panel:#121b2e;--line:#22304b;--txt:#e6edf7;--muted:#8aa0bf;
    --accent:#4f8cff;--good:#37d39b;--bad:#ff6b6b;--chip:#1c2942;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .app{display:flex;flex-direction:column;height:100dvh}
  header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#4f8cff,#37d39b);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#06101f}
  h1{font-size:15px;margin:0}.sub{font-size:11px;color:var(--muted)}
  .sub a{color:var(--accent);text-decoration:none}
  .menubtn{background:#0f1726;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 10px;font-size:15px}
  .seg{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:#0f1726;color:var(--muted);border:none;padding:7px 11px;font-size:12px}
  .seg button.on{background:var(--accent);color:#06101f;font-weight:700}
  .tok{padding:9px 14px;background:#0f1726;border-bottom:1px solid var(--line);display:none}
  .tok input{width:100%;background:#0b1220;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px;font-size:13px}
  /* chat drawer */
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:5}
  .drawer .panel{position:absolute;left:0;top:0;bottom:0;width:78%;max-width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .drawer .newbtn{margin:10px;padding:11px;border:none;border-radius:10px;background:linear-gradient(135deg,#4f8cff,#37d39b);color:#06101f;font-weight:700}
  .drawer .list{flex:1;overflow-y:auto;padding:4px 8px}
  .citem{display:flex;align-items:center;gap:6px;padding:11px 10px;border-radius:9px;font-size:14px;color:var(--muted)}
  .citem.on{background:var(--chip);color:var(--txt)}
  .citem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .citem .x{color:var(--bad);font-weight:700;padding:0 6px}
  .feed{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:var(--accent);color:#06101f;border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  pre.code{background:#06101f;border:1px solid var(--line);border-radius:9px;padding:10px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .act{font-size:11px;color:var(--muted);padding:2px 14px;min-height:16px}
  .bar{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .mic{flex:none;border:none;border-radius:12px;padding:13px;background:#0f1726;border:1px solid var(--line);color:var(--txt);font-size:16px}
  .mic.rec{background:linear-gradient(135deg,#ff6b6b,#ffb547);color:#06101f}
  .tin{flex:1;background:#0f1726;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font-size:15px}
  .send{border:none;border-radius:12px;padding:12px 15px;background:linear-gradient(135deg,#4f8cff,#37d39b);color:#06101f;font-weight:700}
  .err{color:var(--bad);font-size:12px;padding:0 14px}
  table.md{border-collapse:collapse;margin:8px 0;font-size:13px;display:block;overflow-x:auto}
  table.md th,table.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
  table.md th{background:var(--chip)}
  .ai h3.md,.ai h4.md,.ai h5.md{margin:8px 0 4px;font-size:15px;color:#fff}
  .ai ul.md,.ai ol.md{margin:6px 0;padding-left:18px} .ai p.md{margin:5px 0} .ai strong{color:#fff} .ai a{color:var(--accent)}
  code.ic{background:#06101f;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="menubtn" id="menu">☰</button>
    <a href="/" class="logo" style="text-decoration:none">Ω</a>
    <div><h1 id="title">Odin</h1><div class="sub"><span id="state">…</span></div></div>
    <div class="seg"><button id="enB" class="on">EN</button><button id="arB">AR</button></div>
  </header>
  <div class="tok" id="tokRow"><input id="tok" type="password" placeholder="Access token (if required)" /></div>
  <div class="feed" id="feed"></div>
  <div class="act" id="act"></div>
  <div class="err" id="err"></div>
  <div class="bar">
    <button class="mic" id="mic">🎤</button>
    <input class="tin" id="tin" placeholder="Type or talk…" />
    <button class="send" id="send">➤</button>
  </div>
</div>
<div class="drawer" id="drawer"><div class="panel">
  <button class="newbtn" id="newBtn">+ New chat</button>
  <div class="list" id="list"></div>
  <div style="padding:10px 14px;border-top:1px solid var(--line)"><a href="/" style="color:var(--accent);text-decoration:none">← Dashboard</a></div>
</div></div>
<script src="/odin-md.js"></script>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  let lang="en", cid=null, recording=false, rec=null, es=null;
  const tokHdr=()=>{const t=$("tok").value.trim();return t?{"X-Odin-Token":t}:{};};
  const tokQS=()=>{const t=$("tok").value.trim();return t?("&token="+encodeURIComponent(t)):"";};
  const player=new Audio();let unlocked=false;const SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
  function unlock(){if(unlocked)return;unlocked=true;try{player.src=SILENT;const p=player.play();if(p&&p.then)p.then(()=>player.pause()).catch(()=>{});}catch(_){}}
  document.addEventListener("click",unlock);

  $("enB").onclick=()=>{lang="en";$("enB").classList.add("on");$("arB").classList.remove("on");};
  $("arB").onclick=()=>{lang="ar";$("arB").classList.add("on");$("enB").classList.remove("on");};
  $("menu").onclick=()=>{$("drawer").style.display="block";loadList();};
  $("drawer").onclick=e=>{if(e.target.id==="drawer")$("drawer").style.display="none";};

  const feed=$("feed");
  const scroll=()=>feed.scrollTop=feed.scrollHeight;
  function renderInto(el,raw){ window.OdinMD.render(el, raw||""); }
  function addMsg(role,content){const d=document.createElement("div");d.className="msg "+(role==="user"?"me":"ai");d.dir="auto";renderInto(d,content||"");feed.appendChild(d);scroll();return d;}

  async function api(path,opts={}){opts.headers=Object.assign({},opts.headers||{},tokHdr());const r=await fetch(path,opts);if(r.status===401){$("tokRow").style.display="block";$("err").textContent="Enter the access token above.";throw new Error("401");}return r;}
  async function loadList(){const r=await api("/chats");const {chats}=await r.json();const list=$("list");list.innerHTML="";
    chats.forEach(c=>{const it=document.createElement("div");it.className="citem"+(c.id===cid?" on":"");
      it.innerHTML=`<span class="t">${c.title||"New chat"}</span><span class="x">×</span>`;
      it.querySelector(".t").onclick=()=>{selectChat(c.id);$("drawer").style.display="none";};
      it.querySelector(".x").onclick=async e=>{e.stopPropagation();if(!confirm("Delete?"))return;await api("/chats/"+c.id,{method:"DELETE"});if(c.id===cid){cid=null;localStorage.removeItem("odin_m_cid");}loadList();};
      list.appendChild(it);});return chats;}
  async function selectChat(id){cid=id;localStorage.setItem("odin_m_cid",id);const r=await api("/chats/"+id);const d=await r.json();$("title").textContent=d.title||"Chat";feed.innerHTML="";(d.messages||[]).forEach(m=>addMsg(m.role,m.content));}
  async function newChat(){const r=await api("/chats",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:"New chat"})});const d=await r.json();$("drawer").style.display="none";await selectChat(d.id);}
  $("newBtn").onclick=newChat;

  async function speak(text){if(!text.trim())return;try{player.pause();}catch(_){}
    try{const r=await fetch(`/voice/tts?text=${encodeURIComponent(text)}&lang=${lang}${tokQS()}`,{headers:tokHdr()});if(r.ok){const u=URL.createObjectURL(await r.blob());player.src=u;player.onended=()=>URL.revokeObjectURL(u);await player.play();}}catch(_){}}

  function ask(text){if(!text.trim()||!cid)return;$("err").textContent="";addMsg("user",text);
    const ai=addMsg("assistant","");let answer="";if(es)es.close();
    es=new EventSource(`/chats/${cid}/stream?text=${encodeURIComponent(text)}&lang=${lang}${tokQS()}`);
    es.addEventListener("status",e=>{$("act").textContent=JSON.parse(e.data).icon+" "+JSON.parse(e.data).text;});
    es.addEventListener("token",e=>{answer+=JSON.parse(e.data).t;renderInto(ai,answer);scroll();});
    es.addEventListener("done",()=>{es.close();$("act").textContent="";renderInto(ai,answer);speak(window.OdinMD.toSpeech(answer));});
    es.addEventListener("error",()=>{$("err").textContent="connection lost";es&&es.close();});}
  $("send").onclick=()=>{const t=$("tin").value;$("tin").value="";ask(t);};
  $("tin").addEventListener("keydown",e=>{if(e.key==="Enter"){$("send").click();}});

  $("mic").onclick=()=>{if(recording){rec?.stop();return;}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$("err").textContent="Use Chrome/Safari.";return;}
    rec=new R();rec.lang=lang==="ar"?"ar-EG":"en-US";rec.interimResults=true;rec.continuous=false;let final="";
    rec.onstart=()=>{recording=true;$("mic").classList.add("rec");};
    rec.onerror=e=>{$("err").textContent="mic: "+(e.error||"error");};
    rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t;}$("tin").value=(final+" "+interim).trim();};
    rec.onend=()=>{recording=false;$("mic").classList.remove("rec");const t=$("tin").value;if(t.trim()){$("tin").value="";ask(t);}};
    rec.start();};

  (async()=>{try{$("state").textContent="connecting…";const cs=await loadList();const saved=localStorage.getItem("odin_m_cid");
    if(saved&&cs.find(c=>c.id===saved))await selectChat(saved);else if(cs[0])await selectChat(cs[0].id);else await newChat();
    $("state").textContent="ready";}catch(e){$("state").textContent="needs token / server";}})();
})();
</script>
</body>
</html>
