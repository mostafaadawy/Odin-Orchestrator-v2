body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:22px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 80px;display:grid;gap:20px}
h1{font-size:30px;margin:0}
.lede{margin:6px 0 0;color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:3px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;z-index:3}
.bar b{font-variant-numeric:tabular-nums}
.bar select{font:inherit;font-size:20px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.banner{border:3px solid var(--fg);background:var(--prop-bg);padding:12px 16px;border-radius:8px}
.card{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0}
.card.done{border-color:var(--ok);border-width:5px}
.q{font-weight:700;font-size:20px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.input{font-size:24px;font-weight:700;margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.full{font:inherit;font-size:18px;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;justify-self:start}
.prop{background:var(--prop-bg);border:2px solid var(--fg);border-radius:8px;padding:10px 14px;font-size:22px}
.prop b{font-size:26px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
button.big{font:inherit;font-size:22px;font-weight:700;min-height:56px;padding:10px 22px;border-radius:10px;border:3px solid var(--fg);background:var(--bg);color:var(--fg);cursor:pointer}
button.accept{background:var(--ok);color:var(--ok-ink);border-color:var(--ok)}
button.change{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.opt[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button.big:focus-visible,.full:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
button[disabled]{opacity:.45;cursor:default}
.answer{font-size:22px;font-weight:700;color:var(--ok)}
.undo{font:inherit;font-size:18px;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0}
.empty{text-align:center;padding:30px 0}
</style>

 the full team needed: fullstack engineering, DevOps and CI with sandbox deployment, security with intrusion detection and vulnerability management, HubSpot CRM operations, Klaviyo email operations, Veeqo fulfillment operations, analytics, customer support, and a reporting agent. Recurring.", "p": "yes"}, {"k": "1b0f4937589e__D4_qa", "d": "D4_qa", "t": "S10 VM Maybe r1: Fail-safe test: unclear VM wording (isolation; remote calls blocked).", "p": "no"}, {"k": "62dec572397a__D4_qa", "d": "D4_qa", "t": "S7 Calc r3: Tiny local Python utility used to prove a clean, verified pass.", "p": "no"}, {"k": "019ef79fc92e__D4_qa", "d": "D4_qa", "t": "S9 VM Check r1: Read-only VM health check (isolation test; all remote calls are blocked).", "p": "no"}, {"k": "dddf282658c4__D4_qa", "d": "D4_qa", "t": "S8 Calc r3: Tiny local Python utility; changes need the owner's approval.", "p": "no"}, {"k": "d0d3b561a4f1__D4_qa", "d": "D4_qa", "t": "S7 Calc r1: Tiny local Python utility used to prove a clean, verified pass.", "p": "no"}, {"k": "196a0f4cca19__D4_qa", "d": "D4_qa", "t": "S11 Gate r1: Operational test project for the approval rule (local files only).", "p": "no"}, {"k": "d1c892059c56__D9_nature", "d": "D9_nature", "t": "Chunk Analysis Agent — Chunk Analysis Agent: Chunk Analysis Agent specialist for Zoom Smart Meeting Notification Agent", "p": "technical"}, {"k": "5b64ca057656__D9_nature", "d": "D9_nature", "t": "Transcription Agent — Transcription Agent: Transcription Agent specialist for Zoom Smart Meeting Notification Agent", "p": "technical"}, {"k": "f09104d646aa__D9_nature", "d": "D9_nature", "t": "Notification Agent — Notification Agent: Notification Agent specialist for Zoom Smart Meeting Notification Agent", "p": "technical"}, {"k": "9b5d9cfd7d4c__D9_nature", "d": "D9_nature", "t": "Memory and Storage Agent — Memory and Storage Agent: Memory and Storage Agent specialist for Zoom Smart Meeting Notification Agent", "p": "technical"}, {"k": "f10b1e78fc1b__D9_nature", "d": "D9_nature", "t": "Chunking Agent — Chunking Agent: Chunking Agent specialist for Zoom Smart Meeting Notification Agent", "p": "technical"}, {"k": "8b80fd1214d1__D9_nature", "d": "D9_nature", "t": "Final Summary Agent — Final Summary Agent: Final Summary Agent specialist for Zoom Smart Meeting Notification Agent", "p": "technical"}, {"k": "bd1cc449e39a__D9_nature", "d": "D9_nature", "t": "Fullstack — Full-Stack Engineer: Builds the ENTIRE web application — frontend + backend + database — in ONE hand, in ANY web stack (Node.js/TS, Laravel/PHP, Python/Django, .NET/C#, Rails, …), installing whatever it needs (Node, Laravel, .NET, etc.). May use Flutter for WEB targets only (never mobile). RESEARCHES & WRITES every third-party integration itself (HubSpot, Klaviyo, Mailchimp, Veeqo, 3PL, GA, …) — for those it only ASKS the relevant operator for that service's API KEY, then writes the calling code. One owner of the whole web codebase: NO frontend/backend hand-off, no shared-folder conflict. Does NOT build mobile apps (Mobile) and does NOT deploy (DevOps).", "p": "technical"}, {"k": "3df98b6ff0fe__D9_nature", "d": "D9_nature", "t": "QA / Reviewer (operational) — Content Reviewer Agent: Content Reviewer Agent - Rule Definition", "p": "operational"}, {"k": "da7773222710__D9_nature", "d": "D9_nature", "t": "Content — Content Creator: NON-technical. Produces posts, copy & a content calendar; writes NO code.", "p": "operational"}, {"k": "c43a03c9015e__D9_nature", "d": "D9_nature", "t": "HubSpot — HubSpot CRM Specialist: Hired by the CTO while planning: please use the next commands to get the reason for the 400 b", "p": "operational"}, {"k": "8c31cc233385__D9_nature", "d": "D9_nature", "t": "EasyPost — EasyPost Shipping & Tracking Operator: Carrier-agnostic post-shipping tracking status via EasyPost; runs after Veeqo.", "p": "operational"}, {"k": "a91516004ca7__D9_nature", "d": "D9_nature", "t": "Content Creator — Content Creator: Content Creator specialist for Egypt Amazon Daily Social Content Agent", "p": "operational"}, {"k": "4897b18efc00__D9_nature", "d": "D9_nature", "t": "Sales — Sales & Outreach: NON-technical operator of the CRM via its API. Leads, outreach, follow-ups and pipeline status; writes NO code.", "p": "operational"}, {"k": "cb8735985181__D9_nature", "d": "D9_nature", "t": "Identity & Access Governance Agent — Identity & Access Governance Agent: Enumerates accounts, SSH keys, sudo/privileges, dormant/over-privileged users, MFA coverage and key age; flags least-privilege violations. Read-only; account/key changes are approval-gated.", "p": "operational"}];
const Q = {D2_agent:"Which specialist owns this?", D1_mode:"Direct, or a team (orchestrate)?", D2_action:"Only read, or change something?",
           D4_qa:"Does this project need a QA gate?", D9_nature:"Does this agent write code (technical) or not (operational)?"};
const OPTS = {D2_agent:["Frontend","Backend","DevOps & Cloud","Security & Compliance","QA & Testing","Database","CTO Brain"],
  D1_mode:["direct","orchestrate"], D2_action:["read","change"], D4_qa:["yes","no"], D9_nature:["technical","operational"]};
let labels = {}, db = null, canWrite = true; const changing = new Set(), full = new Set(), busy = new Set();
const $ = (id) => document.getElementById(id);
function el(t,a,...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{})){if(x==="class")e.className=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v);}for(const c of k)if(c!=null)e.append(c);return e;}
function oneLine(t){ const s=t.replace(/\s+/g," ").trim(); return s.length>110 ? s.slice(0,107)+"…" : s; }
async function save(r, value){
  if(!db||!canWrite||busy.has(r.k)) return;
  busy.add(r.k); const prev=labels[r.k];
  if(value===null) delete labels[r.k]; else labels[r.k]={label:value, how:value===r.p?"accepted":"changed"};
  changing.delete(r.k); render();
  try{ const ref=db.collection("labels").doc(r.k);
       if(value===null) await ref.delete(); else await ref.set({label:value, decision:r.d, how:labels[r.k].how, at:Date.now()}); }
  catch(e){ if(prev) labels[r.k]=prev; else delete labels[r.k];
    if(e&&e.code==="invalid_argument"){canWrite=false;banner("Only the owner can save answers on this page.");} else banner("Not saved. Check your connection and press the button again."); }
  finally{ busy.delete(r.k); render(); }
}
function card(r){
  const a=labels[r.k], c=el("article",{class:"card"+(a?" done":"")});
  c.append(el("div",{class:"q"},Q[r.d]));
  const long = r.t.replace(/\s+/g," ").trim().length>110;
  c.append(el("p",{class:"input"}, full.has(r.k)?r.t:oneLine(r.t)));
  if(long) c.append(el("button",{class:"full",onclick:()=>{full.has(r.k)?full.delete(r.k):full.add(r.k);render();}}, full.has(r.k)?"Show one line":"Show full text"));
  c.append(el("div",{class:"prop"},"Proposed: ", el("b",{},r.p)));
  if(a && !changing.has(r.k)){
    c.append(el("div",{class:"answer"}, a.label==="unsure"?"You said: not sure":"Your answer: "+a.label));
    c.append(el("div",{class:"btns"}, el("button",{class:"undo",onclick:()=>save(r,null)},"Undo"), el("button",{class:"undo",onclick:()=>{changing.add(r.k);render();}},"Change answer")));
  } else if(changing.has(r.k)){
    const b=el("div",{class:"btns"});
    for(const o of OPTS[r.d]) b.append(el("button",{class:"big opt","aria-pressed":String(a&&a.label===o),onclick:()=>save(r,o)},o));
    b.append(el("button",{class:"big",onclick:()=>save(r,"unsure")},"Not sure"), el("button",{class:"undo",onclick:()=>{changing.delete(r.k);render();}},"Cancel"));
    c.append(b);
  } else {
    c.append(el("div",{class:"btns"}, el("button",{class:"big accept",onclick:()=>save(r,r.p)},"Accept"),
      el("button",{class:"big change",onclick:()=>{changing.add(r.k);render();}},"Change")));
  }
  if(!db||!canWrite) c.querySelectorAll("button.big").forEach(x=>x.disabled=true);
  return c;
}
function render(){
  $("total").textContent=ROWS.length; $("done").textContent=ROWS.filter(r=>labels[r.k]).length;
  const s=$("show").value; let rs=ROWS;
  if(s==="todo") rs=rs.filter(r=>!labels[r.k]||changing.has(r.k)); if(s==="done") rs=rs.filter(r=>labels[r.k]);
  const L=$("list"); L.replaceChildren(...rs.map(card));
  if(!rs.length) L.append(el("p",{class:"empty"}, s==="todo"?"All done. Thank you.":"Nothing here yet."));
}
function banner(m){const b=$("banner");b.textContent=m;b.hidden=false;}
$("show").addEventListener("change",render); render();
(async()=>{
  try{ db=await window.claude?.use?.("db"); }catch(e){ db=null; }
  if(!db){ banner("Answers can't be saved in this view. Open the page on claude.ai while signed in."); render(); return; }
  try{ const u=await window.claude.use("user"); if(u&&(await u.can("data.write"))===false){canWrite=false;banner("Only the owner can save answers on this page.");} }catch(e){}
  db.collection("labels").limit(1000).onSnapshot(s=>{const m={};for(const d of s.docs){const x=d.data();if(x&&x.label)m[d.id]={label:x.label,how:x.how};}labels=m;render();},
    e=>banner("Live sync stopped. Reload the page to continue."));
})();
</script>
